# fly.toml — provocativeness scorer
#
# STATUS: STUB / NOT DEPLOYED.
#
# On ECS today this service runs with `desired_count = 0` and has been dormant
# since the council-style scoring collapse (see docs/architecture/vercel-migration.md
# + polemicyst.com/CLAUDE.md — the LLM scoring provider now returns all subscores
# in a single call via ScoringProvider). The `workers/llm-worker` image is
# `SCORING_TYPE`-parameterized: {PROVOCATIVENESS, COMEDIC} share the same code,
# same Dockerfile — this .toml is kept so if we ever revive them we already have
# a Fly.io shape to launch into. Do NOT `flyctl launch` this today.
#
# It also depends on Ollama — the Ollama deployment strategy is being decided
# separately by the LLM-strategy agent. Whatever they land on, this worker's
# OLLAMA_HOST env var should point at it.

app = "polemicyst-provocativeness"
primary_region = "iad"

[build]
  # workers/llm-worker/Dockerfile is the shared image; SCORING_TYPE distinguishes
  # instances. Deploy (if ever) with:
  #   flyctl deploy --config fly/provocativeness/fly.toml \
  #                 --dockerfile workers/llm-worker/Dockerfile .
  dockerfile = "../../workers/llm-worker/Dockerfile"

[env]
  NODE_ENV = "production"
  ENVIRONMENT = "prod"
  SCORING_TYPE = "PROVOCATIVENESS"
  MODEL_NAME = "llama3"
  # OLLAMA_HOST left as a Fly Secret — the LLM-strategy agent decides the
  # target endpoint (self-hosted Fly Ollama machine, Replicate, Together, etc.).

[[services]]
  internal_port = 3000
  protocol = "tcp"
  auto_stop_machines = true
  auto_start_machines = true
  # min = 0 mirrors ECS `desired_count = 0` — dormant until reactivated.
  min_machines_running = 0

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "30s"

# Sized to match ECS today (1 vCPU, 4 GB — Ollama-adjacent memory footprint).
# On Fly this is `shared-cpu-2x` + 4 GB.
[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
  cpus = 2
  cpu_kind = "shared"

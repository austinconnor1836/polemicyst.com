# fly.toml — comedic scorer
#
# STATUS: STUB / NOT DEPLOYED.
#
# Sibling of fly/provocativeness/fly.toml — same story: dormant on ECS
# (`desired_count = 0`), same underlying `workers/llm-worker` image differing
# only by SCORING_TYPE. See fly/provocativeness/fly.toml for the full rationale.
# Do NOT `flyctl launch` this today; kept as a shape for future revival.

app = "polemicyst-comedic"
primary_region = "iad"

[build]
  dockerfile = "../../workers/llm-worker/Dockerfile"

[env]
  NODE_ENV = "production"
  ENVIRONMENT = "prod"
  SCORING_TYPE = "COMEDIC"
  MODEL_NAME = "llama3"

[[services]]
  internal_port = 3000
  protocol = "tcp"
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
  cpus = 2
  cpu_kind = "shared"

name: Clipfire
options:
  bundleIdPrefix: com.clipfire
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '16.0'
  generateEmptyDirectories: false
  groupSortPosition: top

configFiles:
  Debug: xcconfig/Debug.xcconfig
  Release: xcconfig/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: '5.9'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'

packages:
  GoogleSignIn-iOS:
    url: https://github.com/google/GoogleSignIn-iOS
    from: '8.0.0'
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: '11.0.0'

targets:
  ClipfireiOS:
    type: framework
    platform: iOS
    sources:
      - path: Sources/ClipfireiOS
    dependencies:
      - package: GoogleSignIn-iOS
        product: GoogleSignIn
      - package: GoogleSignIn-iOS
        product: GoogleSignInSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clipfire.ios
        GENERATE_INFOPLIST_FILE: true
        MARKETING_VERSION: '0.4.9'
        CURRENT_PROJECT_VERSION: '1'

  ClipfireApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/ClipfireApp
      - path: Supporting/Assets.xcassets
    dependencies:
      - target: ClipfireiOS
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseCrashlytics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clipfire.app
        PRODUCT_NAME: Clipfire
        MARKETING_VERSION: '0.4.9'
        CURRENT_PROJECT_VERSION: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Supporting/Clipfire.entitlements
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        API_BASE_URL: 'https://polemicyst.com'
        # Standalone Polemicyst Graphic render service (separate from the monolith
        # so it stays up while the monolith is hibernated). Same value in Debug +
        # Release. The secret only gates a public, stateless render endpoint — no
        # user data — so shipping it in the binary is acceptable (mirrors how
        # API_BASE_URL is wired as a build setting → Info.plist).
        GRAPHIC_RENDER_URL: 'https://polemicyst-graphic-render.vercel.app'
        GRAPHIC_RENDER_SECRET: 'cc07c64dc799c9faabaf706ba6038b2209cbb51dd4cb9dbb'
        # Standalone transcript service (tiny Python `youtube-transcript-api`
        # server). The on-device raw caption fetch returns empty for
        # auto-generated captions after recent YouTube changes; this service
        # fetches them from a residential IP instead. DEBUG points at the host
        # Mac via localhost (the simulator shares the Mac's network); Release is
        # a placeholder until the public deploy lands. No secret for the local
        # path (the service runs open); set TRANSCRIPT_SERVICE_SECRET once the
        # public deploy gates on x-render-secret.
        TRANSCRIPT_SERVICE_URL: 'http://localhost:8791'
        TRANSCRIPT_SERVICE_SECRET: 'cc07c64dc799c9faabaf706ba6038b2209cbb51dd4cb9dbb'
      configs:
        Debug:
          # LAN IP — works when iPhone is on same Wi-Fi as this Mac. Switch to
          # Tailscale IP (e.g. https://100.124.11.69:3000) when iterating from
          # a different network AND Tailscale is active on the phone.
          API_BASE_URL: 'https://192.168.0.16:3000'
          # Simulator reaches the host Mac (and its residential IP) via localhost.
          TRANSCRIPT_SERVICE_URL: 'http://localhost:8791'
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: L6AS5GG2MB
        Release:
          API_BASE_URL: 'https://polemicyst.com'
          # Free residential-IP backend: the transcript service runs on Austin's
          # Mac (youtube-transcript-api needs a residential IP — YouTube blocks
          # datacenter IPs) and is exposed publicly via Tailscale Funnel. Works
          # when the Mac is awake. Gated by TRANSCRIPT_SERVICE_SECRET.
          TRANSCRIPT_SERVICE_URL: 'https://austins-macbook-pro.tailbdd40e.ts.net'
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: 'Apple Distribution'
          DEVELOPMENT_TEAM: '$(DEVELOPMENT_TEAM)'
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: Clipfire
        API_BASE_URL: '$(API_BASE_URL)'
        GRAPHIC_RENDER_URL: '$(GRAPHIC_RENDER_URL)'
        GRAPHIC_RENDER_SECRET: '$(GRAPHIC_RENDER_SECRET)'
        TRANSCRIPT_SERVICE_URL: '$(TRANSCRIPT_SERVICE_URL)'
        TRANSCRIPT_SERVICE_SECRET: '$(TRANSCRIPT_SERVICE_SECRET)'
        GIDClientID: '$(GOOGLE_CLIENT_ID)'
        GOOGLE_SERVER_CLIENT_ID: '$(GOOGLE_SERVER_CLIENT_ID)'
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - '$(GOOGLE_CLIENT_ID_REVERSED)'
        UIBackgroundModes:
          - fetch
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: 'Clipfire reads videos directly from your photo library for the Stitch feature, so clips don''t need to be copied first.'
        NSPhotoLibraryAddUsageDescription: 'Clipfire saves rendered stitches back to your photo library when you choose to.'
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    scheme:
      testTargets:
        - ClipfireiOSTests
        - ClipfireUITests
      gatherCoverageData: true

  ClipfireUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: ClipfireApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clipfire.uitests
        GENERATE_INFOPLIST_FILE: true

  ClipfireiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ClipfireiOS
      - target: ClipfireApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clipfire.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/Clipfire.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Clipfire'
        BUNDLE_LOADER: '$(TEST_HOST)'
